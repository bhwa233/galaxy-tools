name: Native payloads
on:
  workflow_dispatch:
  push:
    tags: ["native-payloads-*"]
permissions:
  contents: write
jobs:
  payloads:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pwsh -NoProfile -File scripts/prepare-windows-resources.ps1
      - run: node scripts/native-payloads.mjs pack --out local-build/native-payloads
      - uses: actions/upload-artifact@v4
        with:
          name: spark233-native-payloads
          path: |
            local-build/native-payloads/*.tar.gz
            local-build/native-payloads/native-payloads.json
          if-no-files-found: error
      - name: Publish payload release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "预编译原生插件载荷，提交 ${{ github.sha }}。"
          }
          gh release upload $tag local-build/native-payloads/*.tar.gz local-build/native-payloads/native-payloads.json --clobber
