name: Electron Windows Installer
# Manual installer and native payload builds from source for any branch.
# Releases are made by release.yml when the host version changes on main.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pwsh -NoProfile -File scripts/prepare-windows-resources.ps1
      - run: node scripts/native-payloads.mjs pack --out local-build/native-payloads
      - uses: actions/upload-artifact@v4
        with:
          name: spark233-native-payloads
          path: |
            local-build/native-payloads/*.tar.gz
            local-build/native-payloads/native-payloads.json
          if-no-files-found: error
      - run: pnpm test
      # Tag builds publish the NSIS installer plus channel metadata/blockmap so
      # electron-updater can find and verify the release; branch runs only
      # produce a local installer artifact.
      - name: Build and publish the matching release channel
        shell: bash
        run: |
          release_version=$(node -p "require('./apps/desktop/package.json').version")
          release_channel=latest
          release_type=release
          if [[ "$release_version" == *-beta || "$release_version" == *-beta.* ]]; then
            release_channel=beta
            release_type=prerelease
          elif [[ "$release_version" == *-* ]]; then
            echo "Unsupported release channel: $release_version" >&2
            exit 1
          fi
          pnpm dist:win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} \
            "--config.publish.channel=$release_channel" \
            "--config.publish.releaseType=$release_type"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: spark233-installer-x64
          path: release-electron/*.exe
          if-no-files-found: error
