name: Electron Windows Installer
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pwsh -NoProfile -File scripts/prepare-windows-resources.ps1
      - run: node scripts/native-payloads.mjs pack --out local-build/native-payloads
      - uses: actions/upload-artifact@v4
        with:
          name: spark233-native-payloads
          path: |
            local-build/native-payloads/*.tar.gz
            local-build/native-payloads/native-payloads.json
          if-no-files-found: error
      - run: pnpm test
      # Tag builds publish the NSIS installer plus latest.yml/blockmap so
      # electron-updater can find and verify the release; branch runs only
      # produce a local installer artifact.
      - run: pnpm dist:win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: spark233-installer-x64
          path: release-electron/*.exe
          if-no-files-found: error
