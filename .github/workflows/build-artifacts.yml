name: Electron Windows Installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: floral-electron-installer-x64
          path: release-electron/*.exe
          if-no-files-found: error
